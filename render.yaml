# Blueprint Render: database + backend + frontend.
# Su Render: New > Blueprint > repository > Apply.

databases:
  - name: robot-vetrina-db
    databaseName: robot_vetrina
    user: robot_vetrina
    plan: free
    region: frankfurt

services:
  # ---------- Backend: Spring Boot via Docker ----------
  - type: web
    name: robot-vetrina-be
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: be
    # dockerfilePath parte da rootDir; buildFilter dalla radice della repo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - be/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robot-vetrina-db
          property: connectionString
      # Origine del FE per il CORS, es. https://robot-vetrina-fe.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false
      # Chiave HMAC dei JWT: Render la genera casuale al primo deploy.
      - key: JWT_SECRET
        generateValue: true
      # Password dell'admin creato dal seeder: da impostare nel dashboard.
      - key: ADMIN_PASSWORD
        sync: false

  # ---------- Frontend: build Vite statica ----------
  - type: web
    name: robot-vetrina-fe
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - fe/**
        - render.yaml
    envVars:
      # Indirizzo del BE, es. https://robot-vetrina-be.onrender.com (senza / finale)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
